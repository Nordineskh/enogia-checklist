<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ENOGIA — Atelier idéal en U</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Abel&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#06303f; --ink2:#3d6573; --ink3:#6f8f99;
  --panel:#ffffffe6; --panel-solid:#ffffff; --line:#d3e0e4; --chip:#eef4f6;
  --teal:#2aa99e; --blue:#0086c2; --amber:#e8a317; --red:#d9534f; --orange:#ee6a2c;
  --scene:#e7ecee;
  --shadow:0 10px 30px rgba(6,48,63,.14);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#eaf6f9; --ink2:#a9cad4; --ink3:#78a2ae;
    --panel:#062b39e8; --panel-solid:#062b39; --line:#14495a; --chip:#0b3a4b;
    --scene:#cfd8db; --shadow:0 10px 30px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#eaf6f9; --ink2:#a9cad4; --ink3:#78a2ae;
  --panel:#062b39e8; --panel-solid:#062b39; --line:#14495a; --chip:#0b3a4b;
  --scene:#cfd8db; --shadow:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--scene);color:var(--ink);font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- Barre du haut ---------- */
.top{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;gap:10px;align-items:stretch;pointer-events:none;z-index:5}
.brand,.ctrls,.clock{pointer-events:auto;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px;padding:8px 14px 8px 10px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--teal),var(--blue));display:grid;place-items:center;color:#fff;font-family:Abel,sans-serif;font-size:19px}
.brand h1{font-family:Abel,sans-serif;font-weight:400;font-size:21px;letter-spacing:.06em;line-height:1}
.brand p{font-size:12px;color:var(--ink2);margin-top:3px}
.clock{display:flex;align-items:center;gap:10px;padding:0 14px;font-size:13px;font-variant-numeric:tabular-nums}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--teal);font-weight:700}
.live i{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 0 #2aa99e88;animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 #2aa99e99}80%,100%{box-shadow:0 0 0 9px #2aa99e00}}
.spacer{flex:1}
.ctrls{display:flex;align-items:center;padding:5px;gap:4px}
.ctrls button{border:none;background:transparent;border-radius:8px;padding:8px 11px;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.ctrls button:hover{background:var(--chip)}
.ctrls button[aria-pressed="true"]{background:var(--blue);color:#fff}

/* ---------- Panneau stations ---------- */
.stations{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 74px);width:282px;max-height:calc(100% - 74px - 200px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:4}
.stations header{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px 8px;position:sticky;top:0;background:var(--panel-solid);border-radius:12px 12px 0 0;z-index:1}
.stations h2{font-family:Abel,sans-serif;font-weight:400;font-size:18px;letter-spacing:.04em}
.stations header span{font-size:12px;color:var(--ink3)}
.st{display:grid;grid-template-columns:28px 1fr auto;gap:2px 10px;align-items:center;width:100%;text-align:left;border:none;border-top:1px solid var(--line);background:none;padding:10px 14px;cursor:pointer}
.st:hover{background:var(--chip)}
.st.on{background:var(--chip);box-shadow:inset 3px 0 0 var(--blue)}
.st-n{grid-row:span 2;width:26px;height:26px;border-radius:7px;background:var(--chip);border:1px solid var(--line);display:grid;place-items:center;font-family:Abel,sans-serif;font-size:15px;color:var(--ink2)}
.st.on .st-n{background:var(--blue);border-color:var(--blue);color:#fff}
.st-name{font-weight:500;font-size:13.5px}
.st-pct{font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.st-meta{grid-column:2/4;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink3)}
.bar{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar b{display:block;height:100%;background:var(--teal);border-radius:2px;transition:width .6s}

/* ---------- Fiche station ---------- */
.detail{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 74px);width:330px;max-height:calc(100% - 74px - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:4;transform:translateX(calc(100% + 24px));transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.detail.open{transform:none}
.detail .d-head{padding:14px 16px 12px;border-bottom:1px solid var(--line);position:relative}
.d-close{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:8px;border:none;background:var(--chip);cursor:pointer;font-size:16px}
.d-step{font-size:12px;color:var(--ink3)}
.d-title{font-family:Abel,sans-serif;font-size:24px;line-height:1.1;margin:2px 36px 6px 0}
.d-machine{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11.5px;border-radius:6px;padding:3px 8px;background:var(--chip);border:1px solid var(--line);color:var(--ink2)}
.d-kpis{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.d-kpis div{padding:12px 14px}
.d-kpis div+div{border-left:1px solid var(--line)}
.d-kpis b{display:block;font-family:Abel,sans-serif;font-size:24px;font-weight:400;font-variant-numeric:tabular-nums}
.d-kpis span{font-size:11.5px;color:var(--ink3)}
.d-sec{padding:12px 16px}
.d-sec h3{font-size:12px;font-weight:500;color:var(--ink3);margin-bottom:8px}
.tech{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.tech:first-of-type{border-top:none}
.helmet{width:26px;height:26px;border-radius:50% 50% 40% 40%;flex-shrink:0;border:1px solid #0002;margin-top:1px}
.tech b{font-weight:500;font-size:13px}
.tech p{font-size:12px;color:var(--ink2);margin-top:2px;line-height:1.35}
.tech small{font-size:11px;color:var(--ink3)}

/* ---------- Fil d'activité ---------- */
.feed{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:420px;max-width:calc(100% - 24px);background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:4;overflow:hidden}
.feed h2{font-size:12px;font-weight:500;color:var(--ink3);padding:10px 14px 4px}
.feed ul{list-style:none;height:132px;overflow:hidden;padding:0 14px 8px}
.feed li{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:5px 0;font-size:12.5px;line-height:1.35;border-top:1px solid var(--line);animation:feedIn .4s ease-out}
.feed li:first-child{border-top:none}
.feed time{color:var(--ink3);font-variant-numeric:tabular-nums}
.feed li.nc span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:1px}
.feed li.stock span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-right:6px;vertical-align:1px}
@keyframes feedIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ---------- Étiquettes 3D ---------- */
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.lb{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;will-change:transform}
.lb-st{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:7px;background:#ffffffee;color:#06303f;border:1px solid #cfdde2;border-radius:8px;padding:4px 9px 4px 5px;font-size:12px;box-shadow:0 4px 14px rgba(6,48,63,.18)}
.lb-st i{font-style:normal;background:var(--orange);color:#fff;border-radius:5px;padding:1px 6px;font-family:Abel,sans-serif;font-size:13px}
.lb-st em{font-style:normal;color:#2aa99e;font-weight:700;font-variant-numeric:tabular-nums}
.lb-st.on{border-color:var(--blue);box-shadow:0 0 0 2px #0086c255,0 4px 14px rgba(6,48,63,.18)}
.lb-t{font-size:10.5px;background:#06303fd9;color:#fff;border-radius:5px;padding:2px 6px}
.lb-t.ve{background:#0086c2e6}
body.nolabels .lb-t{display:none}
.hint{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);font-size:11.5px;color:#3d6573;background:#ffffffcc;border-radius:8px;padding:6px 10px;z-index:2}

/* ---------- Mobile ---------- */
@media (max-width:860px){
  .brand p,.clock .date{display:none}
  .stations{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:12px;right:12px;width:auto;max-height:none;display:flex;overflow-x:auto;overflow-y:hidden;border-radius:12px;scroll-snap-type:x mandatory}
  .stations header{display:none}
  .st{flex:0 0 210px;border-top:none;border-left:1px solid var(--line);scroll-snap-align:start}
  .st:first-of-type{border-left:none}
  .feed{display:none}
  .hint{display:none}
  .detail{left:12px;right:12px;width:auto;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);max-height:55%;transform:translateY(calc(100% + 140px))}
  .detail.open{transform:none}
  .ctrls .opt{display:none}
}
@media (max-width:520px){
  .clock{display:none}
  .brand h1{font-size:18px}
}
@media (prefers-reduced-motion:reduce){
  .live i{animation:none}
  .feed li{animation:none}
  .detail{transition:none}
}

.st-n.z{font-size:13px}
.st.support .st-n{background:transparent;border-style:dashed}
.grp{padding:10px 14px 4px;font-size:11.5px;color:var(--ink3);border-top:1px solid var(--line)}
.legend{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 44px);background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 14px;font-size:12px;z-index:4;max-width:260px}
.legend b{font-weight:500}
.legend p{color:var(--ink2);margin-top:4px;line-height:1.4}
.lb-z{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:7px;background:#ffffffee;color:#06303f;border:1px solid #cfdde2;border-radius:8px;padding:4px 9px 4px 5px;font-size:12px;box-shadow:0 4px 14px rgba(6,48,63,.18)}
.lb-z i{font-style:normal;color:#fff;border-radius:5px;padding:1px 6px;font-family:Abel,sans-serif;font-size:13px}
.lb-z em{font-style:normal;color:#6f8f99;font-size:11px}
.lb-z .zb{margin-left:2px}
body.tv .stations,body.tv .feed,body.tv .hint,body.tv .ctrls{display:none}
body.tv .brand p{display:block}
.lb-z.on{border-color:var(--blue);box-shadow:0 0 0 2px #0086c255,0 4px 14px rgba(6,48,63,.18)}
.mach{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px}
.mach:first-of-type{border-top:none}
.mach small{grid-column:1/3;color:var(--ink3);font-size:11.5px}
.mach .bar{grid-column:1/3}
.steps-list{display:flex;flex-direction:column;gap:3px}
.steps-list div{font-size:12.5px;display:grid;grid-template-columns:22px 1fr;gap:6px}
.steps-list span{color:var(--ink3);font-variant-numeric:tabular-nums}
@media (max-width:860px){ .legend{display:none} }
</style>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="Vue 3D de l’atelier idéal en U"></canvas>
<div id="labels" aria-hidden="true"></div>

<div class="top">
  <div class="brand">
    <div class="brand-mark">E</div>
    <div><h1>ENOGIA</h1><p>Atelier idéal — 26 × 16 m, flux en U</p></div>
  </div>
  <div class="clock"><span class="live"><i></i>Simulation</span><span id="clock">--:--:--</span><span class="date" id="date"></span></div>
  <div class="spacer"></div>
  <div class="ctrls" role="toolbar" aria-label="Commandes de la vue">
    <button id="bTour" aria-pressed="false">Visite guidée</button>
    <button id="bTop" class="opt">Vue de dessus</button>
    <button id="bHome">Vue d’ensemble</button>
    <button id="bLabels" class="opt" aria-pressed="false">Noms</button>
    <button id="bPause" class="opt" aria-pressed="false">Pause</button>
  </div>
</div>

<nav class="stations" aria-label="Zones de l’atelier">
  <header><h2>Zones</h2><span id="techCount"></span></header>
  <div id="stList"></div>
</nav>

<aside class="detail" id="detail" aria-live="polite"></aside>

<section class="feed" aria-label="Activité de l’atelier">
  <h2>Activité simulée</h2>
  <ul id="feed"></ul>
</section>

<div class="hint">Glisser pour tourner · molette pour zoomer · clic droit pour déplacer</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =====================================================================
   PLAN DE L'ATELIER (mètres) — x : gauche → droite, z : haut → bas
   Bâtiment 26 × 16 m — portes sur le mur du haut (flux en U)
   ===================================================================== */
const BW=26, BD=16, X0=-13, Z0=-8;
const STEPS=['Turbine A (Armoire)','Turbine B (Brides)','Cycle ORC','Instrumentation Cycle ORC','Cycle Lub',
             'Cycle Cooling — Préparation','Cycle Cooling — Installation','Assemblage électrique','Boucle chaude','Boucle froide'];
const ZONES=[
  {id:'z1', n:'1', name:'Montage mécanique', sub:'Étapes 1 à 5 · 2 machines', color:'#ee6a2c', r:[1.3,0.1,12.8,7.8], steps:[0,1,2,3,4], prod:true,
   machines:[{sn:'PJ438',model:'ENO 180 LTV3',step:'',p:22,first:1,bay:'z1a'},{sn:'PJ437',model:'ENO 180 MTV3',step:'',p:71,first:1,bay:'z1b'}]},
  {id:'z2', n:'2', name:'Montage électrique', sub:'Étapes 6 à 10 · 2 machines', color:'#0086c2', r:[-12.8,0.1,-1.3,7.8], steps:[5,6,7,8,9], prod:true,
   machines:[{sn:'PJ436',model:'ENO 180 LTV3',step:'',p:28,first:6,bay:'z2a'},{sn:'PJ435',model:'ENO 100 LTV3',step:'',p:76,first:6,bay:'z2b'}]},
  {id:'z3', n:'3', name:'Banc d’essai', sub:'2 machines raccordées à la chaufferie', color:'#2aa99e', r:[-12.8,-7.8,-1.3,-0.1], prod:true,
   machines:[{sn:'PJ434',model:'ENO 180 LTV3',step:'Essai en charge',p:45},{sn:'PJ433',model:'ENO 180 MTV3',step:'Essai d’étanchéité',p:20}]},
  {id:'z4', n:'4', name:'Conditionnement & expédition', sub:'Film noir · 2 machines', color:'#7a5bd6', r:[1.3,-7.8,12.8,-0.1], prod:true,
   machines:[{sn:'PJ432',model:'ENO 180 LTV3',step:'Mise sous film',p:70},{sn:'PJ431',model:'ENO 40 LTV3',step:'Prête au chargement',p:95}]},
  {id:'stk', n:'S', name:'Stock extérieur', sub:'Au fond, sous abri, accès par la porte du mur de gauche', color:'#1f5fa8', r:[-20,-6.2,-13.5,6.2], support:true, ext:true},
  {id:'tr',  n:'T', name:'Allée centrale', sub:'Transferts entre zones', color:'#e8a317', r:[-1.2,-7.8,1.2,7.8], support:true},
  {id:'chf', n:'C', name:'Chaufferie', sub:'Conteneur 20 pieds, extérieur', color:'#5b6a70', r:[-10.7,-10.95,-4.3,-8.3], support:true}
];
const area=z=>Math.round((z.r[2]-z.r[0])*(z.r[3]-z.r[1]));

const TASKS={
  turb:['Turbine A — fixer les injecteurs (7,5 Nm, 6 vis CHC M6x40)','Turbine B — assemblage turbine dans volute (10 Nm)','Support turbine — pose des oreilles (7,5 Nm, 8 vis CHC M6x20)','Capteur de vibration — insert réducteur M8 vers M5','Capteurs de température — mesures 1 et 2'],
  z1:['Cycle ORC — serrer brides DN150 (150 Nm)','Cycle ORC — évaporateur & condenseurs, 64 vis M20x80','Instrumentation — mesure & montage TT-03A','Instrumentation — capteur pression PT','Cycle Lub — flexibles 4 à 10','Cycle Lub — serrer la bride DN50'],
  z2:['Cooling préparation — pot de décantation','Cooling préparation — ventilateur + réservoir','Cooling installation — vase + flow switch','Assemblage électrique — armoires électriques','Assemblage électrique — résistances CBT-V560','Assemblage électrique — vérine & antenne 4G','Boucle chaude — évaporateur partie haute','Boucle chaude — vanne bypass','Boucle froide — condenseur partie basse','Boucle froide — sondes TT-21 & TT-22'],
  z3:['Mise en pression azote — essai d’étanchéité','Remplissage boucle chaude','Démarrage pompe ORC','Relevé des températures en charge','Essai de production électrique'],
  z4:['Mise sous film de protection','Pose du manuel opérateur et des documents','Sanglage sur palette','Chargement camion','Photo de chargement'],
  chef:['Valide en VE la sous-étape en cours','Vérifie les couples de serrage','Contrôle les relevés ohmiques','Répartit les techniciens sur les zones'],
  prod:['Suit l’avancement des 4 machines','Analyse les temps par sous-étape','Traite une requête qualité NC','Prépare le planning de la semaine']
};

/* =====================================================================
   RENDU
   ===================================================================== */
const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color('#e7ecee');
scene.fog=new THREE.Fog('#e7ecee',90,220);
const camera=new THREE.PerspectiveCamera(34,1,.5,400);
const HOME_POS=new THREE.Vector3(12,30,32), HOME_TGT=new THREE.Vector3(-3.5,0,1);
const TOP_POS=new THREE.Vector3(-5.5,46,.01), TOP_TGT=new THREE.Vector3(-5.5,0,0);
camera.position.copy(HOME_POS);
const controls=new THREE.OrbitControls(camera,canvas);
controls.target.copy(HOME_TGT); controls.enableDamping=true; controls.dampingFactor=.08;
controls.maxPolarAngle=Math.PI*.47; controls.minDistance=3; controls.maxDistance=80;
scene.add(new THREE.HemisphereLight('#ffffff','#9fb3b9',.75));
const sun=new THREE.DirectionalLight('#fff6ea',1.2); sun.position.set(30,70,40); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera,{left:-24,right:24,top:20,bottom:-20,near:10,far:160});
sun.shadow.bias=-.0004; sun.shadow.normalBias=.03; scene.add(sun);
const fill=new THREE.DirectionalLight('#cfe8ff',.35); fill.position.set(-50,30,-40); scene.add(fill);

/* ---------- Matériaux ---------- */
const M = {
  floor:  new THREE.MeshStandardMaterial({color:'#dfe4e6', roughness:.92}),
  steel:  new THREE.MeshStandardMaterial({color:'#c4cdd1', metalness:.65, roughness:.33}),
  steelD: new THREE.MeshStandardMaterial({color:'#8d989d', metalness:.6, roughness:.4}),
  frame:  new THREE.MeshStandardMaterial({color:'#0f5f6b', metalness:.3, roughness:.5}),
  dark:   new THREE.MeshStandardMaterial({color:'#2c3539', metalness:.35, roughness:.55}),
  black:  new THREE.MeshStandardMaterial({color:'#1d2326', metalness:.4, roughness:.5}),
  copper: new THREE.MeshStandardMaterial({color:'#b8743f', metalness:.75, roughness:.32}),
  pipe:   new THREE.MeshStandardMaterial({color:'#9aa7ac', metalness:.7, roughness:.3}),
  blue:   new THREE.MeshStandardMaterial({color:'#1f6fb8', metalness:.25, roughness:.5}),
  white:  new THREE.MeshStandardMaterial({color:'#eef1f2', roughness:.55}),
  orange: new THREE.MeshStandardMaterial({color:'#ee6a2c', roughness:.55}),
  yellow: new THREE.MeshStandardMaterial({color:'#f2c230', roughness:.55}),

/* ---------- A* sur la grille ---------- */
const toCell=(x,z)=>[Math.min(NX-1,Math.max(0,Math.floor((x-GX0)/CS))),Math.min(NZ-1,Math.max(0,Math.floor((z-GZ0)/CS)))];
const cellC=(i,j)=>new THREE.Vector3(GX0+(i+.5)*CS,0,GZ0+(j+.5)*CS);
const isFree=(i,j)=>i>=0&&j>=0&&i<NX&&j<NZ&&!GRID[j*NX+i];
function nearestFree(i,j){ if(isFree(i,j)) return [i,j]; for(let r=1;r<12;r++) for(let dj=-r;dj<=r;dj++) for(let di=-r;di<=r;di++){ if(Math.max(Math.abs(di),Math.abs(dj))!==r) continue; if(isFree(i+di,j+dj)) return [i+di,j+dj]; } return [i,j]; }
function lineFree(a,b){ const d=a.distanceTo(b), n=Math.ceil(d/.2); for(let k=0;k<=n;k++){ const x=a.x+(b.x-a.x)*k/n, z=a.z+(b.z-a.z)*k/n; const [i,j]=toCell(x,z); if(!isFree(i,j)) return false; } return true; }
function findPath(from,to){
  const [si,sj]=nearestFree(...toCell(from.x,from.z)), [gi,gj]=nearestFree(...toCell(to.x,to.z));
  const N=NX*NZ, gS=new Float32Array(N).fill(1e9), par=new Int32Array(N).fill(-1), closed=new Uint8Array(N);
  const start=sj*NX+si, goal=gj*NX+gi; gS[start]=0;
  const heap=[[0,start]]; const push=(f,n)=>{heap.push([f,n]); let c=heap.length-1; while(c>0){const p=(c-1)>>1; if(heap[p][0]<=heap[c][0]) break; [heap[p],heap[c]]=[heap[c],heap[p]]; c=p;}};
  const pop=()=>{const top=heap[0], last=heap.pop(); if(heap.length){heap[0]=last; let c=0; for(;;){const l=2*c+1,r=l+1; let m=c; if(l<heap.length&&heap[l][0]<heap[m][0]) m=l; if(r<heap.length&&heap[r][0]<heap[m][0]) m=r; if(m===c) break; [heap[m],heap[c]]=[heap[c],heap[m]]; c=m;}} return top;};
  const H=(n)=>{const i=n%NX,j=(n/NX)|0, dx=Math.abs(i-gi), dz=Math.abs(j-gj); return (dx+dz)+(Math.SQRT2-2)*Math.min(dx,dz);};
  let found=false, guard=0;
  while(heap.length&&guard++<20000){ const [,n]=pop(); if(closed[n]) continue; closed[n]=1; if(n===goal){found=true;break;}
    const i=n%NX, j=(n/NX)|0;
    for(let dj=-1;dj<=1;dj++) for(let di=-1;di<=1;di++){ if(!di&&!dj) continue; const ni=i+di, nj=j+dj; if(!isFree(ni,nj)) continue;
      if(di&&dj&&(!isFree(i+di,j)||!isFree(i,j+dj))) continue;
      const m=nj*NX+ni, c=gS[n]+(di&&dj?Math.SQRT2:1); if(c<gS[m]){ gS[m]=c; par[m]=n; push(c+H(m),m); } } }
  if(!found) return [to.clone?to.clone():new THREE.Vector3(to.x,0,to.z)];
  const cells=[]; for(let n=goal;n!==-1;n=par[n]) cells.push(cellC(n%NX,(n/NX)|0)); cells.reverse();
  const out=[]; let anchor=new THREE.Vector3(from.x,0,from.z), k=0;
  while(k<cells.length-1){ let far=k+1; for(let m=cells.length-1;m>k;m--){ if(lineFree(anchor,cells[m])){ far=m; break; } } out.push(cells[far]); anchor=cells[far]; k=far; }
  out.push(new THREE.Vector3(to.x,0,to.z));
  return out;
}

    const opts=['z1','turb','z2','z3','z4','rack','nc']; let p; do{ p=opts[Math.floor(Math.random()*opts.length)]; }while(p===t.place); t.place=p;
    if(p==='rack'||p==='nc'){ goTo(t,{...pickFrom(PLACES[p],t),pose:'inspect',pick:false}); t.veZone=p; return; }
    const base=pickFrom(PLACES[p],t); const sp={x:base.x+(base.face===0?0:0),z:base.z,face:base.face,pose:'inspect'};
    if(p!=='turb'){ sp.z+=(base.face===0?-.9:base.face===Math.PI?.9:0); sp.x+=(base.face===Math.PI/2?-.9:base.face===-Math.PI/2?.9:0); }
    t.veZone=p; goTo(t,sp); return; }
  if(d.prod){ // tournée d'atelier
    const z=['z1','z2','z3','z4'].filter(x=>x!==t.place)[Math.floor(Math.random()*3)]; t.place=z; t.veZone=z; goTo(t,{...pickFrom(PLACES[z],t),pose:'inspect'}); return; }
  if(t.carrying){ goTo(t,t.returnSpot); return; }
  if(!d.fixed&&d.zone!=='z3'&&Math.random()<.2){ t.returnSpot=t.spot; goTo(t,pickFrom(PLACES.rack,t)); t.fetch=true; return; }
  const home=d.home[Math.floor(Math.random()*d.home.length)]; t.place=home;
  goTo(t,pickFrom(PLACES[home],t));
}

function updateTech(t,dt,time){
  if(t.state==='walk'){
    const target=t.path[0];
    if(!target){ t.state='work'; t.pose=t.spot.pose; t.timer=(t.spot.pick||t.spot.drop)?2.4+Math.random()*1.5:6+Math.random()*9; if(t.def.fixed) t.timer+=8; return; }
    TMP.subVectors(target,t.pos); TMP.y=0; const dist=TMP.length(); const speed=t.carrying?1.15:1.35;
    if(dist<.06){ t.pos.copy(target); t.path.shift(); }
    else { TMP.normalize(); t.pos.addScaledVector(TMP,Math.min(dist,speed*dt)); t.yaw=angLerp(t.yaw,Math.atan2(TMP.x,TMP.z),Math.min(1,dt*9)); }
  } else {
    t.yaw=angLerp(t.yaw,t.spot.face,Math.min(1,dt*5)); t.timer-=dt;
    if(t.timer<=0){
      if(t.spot.pick) t.carrying=true;
      else if(t.spot.drop) t.carrying=false;
      else if(t.carrying&&!t.def.shuttle){ t.carrying=false; }
      if(t.fetch&&t.spot.pick){ t.fetch=false; }
      if(!t.spot.pick&&!t.spot.drop){ t.taskIdx++; logTask(t); }
      nextAction(t);
    }
  }
  t.body.root.position.copy(t.pos); t.body.root.rotation.y=t.yaw; animateTech(t,dt,time);
}
function angLerp(a,b,k){ let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI; return a+d*k; }
/* ---------- Animation des articulations ---------- */
const TMP=new THREE.Vector3();
function lerpA(t,key,target,k){ const a=t.ang[key]??0; t.ang[key]=a+(target-a)*k; return t.ang[key]; }
function animateTech(t,dt,time){
  const b=t.body, k=Math.min(1,dt*8);
  let hipY=.98, torsoX=0, headX=0, headY=0;
  let th=[0,0], kn=[0,0], sh=[0,0], el=[-.15,-.15], shZ=[.08,-.08];
  const ph=t.phase;
  if(t.state==='walk'){
    const sp=t.carrying?6.5:7.5, s=Math.sin(time*sp+ph);
    th=[s*.55,-s*.55]; kn=[Math.max(0,-Math.cos(time*sp+ph))*.9+.05,Math.max(0,Math.cos(time*sp+ph))*.9+.05];
    hipY=.98+Math.abs(Math.cos(time*sp+ph))*.035;
    if(t.carrying){ sh=[-1.0,-1.0]; el=[-.75,-.75]; shZ=[.22,-.22]; }
    else if(t.def.tool==='tablet'){ sh=[-.9,-s*.35]; el=[-1.25,-.25]; headX=.25; }
    else { sh=[-s*.45,s*.45]; el=[-.35,-.35]; }
    torsoX=.06;
  } else {
    const p=t.pose, w=time*2.2+ph;
    if(p==='screw'){ sh=[-1.05,-1.25+Math.sin(w*2.2)*.12]; el=[-1.05,-.85+Math.sin(w*2.2)*.15]; shZ=[.12,-.18]; torsoX=.12; headX=.12+Math.sin(w*.5)*.05; }
    else if(p==='crouch'){ hipY=.55; th=[-1.35,-1.05]; kn=[2.05,1.55]; torsoX=.42; sh=[-1.25,-1.45+Math.sin(w*2.6)*.15]; el=[-.55,-.4+Math.sin(w*2.6)*.18]; headX=.15; }
    else if(p==='bench'){ sh=[-.75,-.85+Math.sin(w*1.8)*.12]; el=[-1.2,-1.1+Math.sin(w*1.8)*.18]; torsoX=.32; headX=.3; }
    else if(p==='inspect'){ sh=[-.85,-.45+Math.sin(w*3)*.06]; el=[-1.35,-1.25]; headX=.38; headY=Math.sin(w*.4)*.25; torsoX=.05; }
    else if(p==='wrap'){ const s=Math.sin(w*1.4); sh=[-1.25+s*.25,-1.25-s*.25]; el=[-.5,-.5]; shZ=[.3+s*.2,-.3+s*.2]; torsoX=.1; headY=s*.2; }
    else if(p==='pick'){ const s=(Math.sin(w*1.5)+1)/2; sh=[-1.6-s*.4,-1.6-s*.4]; el=[-.3,-.3]; headX=-.3; torsoX=-.05; }
    // le pied d'appui reste stable
    if(p!=='crouch'){ th=[.02,-.02]; kn=[.05,.05]; }
  }
  b.hips.position.y=lerpA(t,'hy',hipY,k);
  b.torso.rotation.x=lerpA(t,'tx',torsoX,k);
  b.head.rotation.x=lerpA(t,'hx',headX,k); b.head.rotation.y=lerpA(t,'hyw',headY,k);
  b.legs.forEach((L,i)=>{ L.hip.rotation.x=lerpA(t,'th'+i,th[i],k); L.knee.rotation.x=lerpA(t,'kn'+i,kn[i],k); });
  b.arms.forEach((A,i)=>{ A.sh.rotation.x=lerpA(t,'sh'+i,sh[i],k); A.sh.rotation.z=lerpA(t,'sz'+i,shZ[i],k); A.el.rotation.x=lerpA(t,'el'+i,el[i],k); });
  // outils animés
  if(b.tool&&t.state!=='walk'){
    if(t.def.tool==='wrench'&&t.pose==='screw') b.tool.rotation.y=Math.sin(time*5+ph)*.6;
    if(t.def.tool==='drill'&&b.tool.userData.bit) b.tool.userData.bit.rotation.y+=dt*40;
  }
  b.carry.visible=t.carrying;
}

window.ENOGIA_ATELIER={ setMachine(zoneId,d){ const z=ZONES.find(x=>x.id===zoneId); if(!z||!z.machines) return; const m=z.machines[0];
  if(d.sn) m.sn=d.sn; if(d.model) m.model=d.model;
  if(m.first&&d.step) m.p=Math.max(0,Math.min(99.9,(d.step-m.first)*20+(d.pct||0)/5)); else if(d.pct!=null) m.p=d.pct; syncMachine(z,m); } };
// ===================== MODE EN DIRECT (données de la web app) =====================
let LIVE=false, LIVE_STOCK=null, LIVE_ANDON=[];
function applyState(d){
  if(!LIVE){ LIVE=true; document.querySelector('.live').innerHTML='<i></i>En direct'; feedEl.innerHTML=''; document.querySelector('.feed h2').textContent='Andon et activité'; }
  ['z1','z2','z3','z4'].forEach(zid=>{
    const z=ZONES.find(x=>x.id===zid), list=(d.machines||[]).filter(m=>m.zone===zid);
    z.extra=Math.max(0,list.length-2);
    z.machines=list.slice(0,2).map((m,i)=>({live:true,id:m.id,sn:m.sn,model:m.model,p:m.pct,step:m.step?`Étape ${m.step} — ${m.stepName}`:m.stepName,andon:m.andon,late:m.late,lateTxt:m.lateTxt,op:m.op,bay:zid+(i?'b':'a')}));
    ['a','b'].forEach((s,i)=>{ const m=list[i]; const bid=zid+s;
      if(m){ setBayLevel(bid,m.level); setAndon(bid,m.andon==='red'||m.andon==='orange'||m.andon==='blue'?m.andon:(m.late?'late':(m.andon==='green'?'green':null))); }
      else setBayLevel(bid,null); });
  });
  LIVE_STOCK=d.stock||null; LIVE_ANDON=d.andon||[];
  if(d.feed){ feedEl.innerHTML=d.feed.length?d.feed.map(f=>`<li class="${f.cls||''}"><time>${new Date(f.t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</time><span>${f.txt}</span></li>`).join(''):'<li><time></time><span>Aucun appel Andon pour le moment.</span></li>'; }
  ZONES.forEach(z=>{ const em=z.label.querySelector('em'); if(!z.prod&&z.id!=='stk') return;
    let badge=z.label.querySelector('.zb'); if(!badge){ badge=document.createElement('b'); badge.className='zb'; z.label.appendChild(badge); }
    if(z.id==='stk'){ const n=LIVE_STOCK?LIVE_STOCK.alerts.length:0; badge.textContent=n?`⚠ ${n} à commander`:''; badge.style.cssText=n?'background:#ff9f1a;color:#fff;border-radius:5px;padding:1px 6px;font-size:11px':'display:none'; return; }
    const ms=z.machines||[]; const r=ms.filter(m=>m.andon==='red').length, o=ms.filter(m=>m.andon==='orange').length;
    badge.textContent=r?`🔴 ${r}`:o?`🟠 ${o}`:(z.extra?`+${z.extra} en attente`:''); badge.style.cssText=(r||o||z.extra)?`background:${r?'#ff3b30':o?'#ff9f1a':'#3d6573'};color:#fff;border-radius:5px;padding:1px 6px;font-size:11px`:'display:none'; });
  if(selected>=0) renderDetail();
}
window.addEventListener('message',e=>{ if(e.data&&e.data.type==='enogia-state') applyState(e.data); });
if(window.parent!==window) window.parent.postMessage({type:'enogia-ready'},'*');
function openInApp(id){ window.parent.postMessage({type:'enogia-open',id},'*'); }
const TV=new URLSearchParams(location.search).get('tv')==='1';
if(TV){ document.body.classList.add('tv'); setTimeout(()=>setTour(true),3000); }
window.__atelier={camera,controls,stopFly:()=>{fly=null;}};
loop();
camera.position.set(30,46,52); flyTo(HOME_POS.clone(),HOME_TGT.clone(),2.4);
})();
</script>
